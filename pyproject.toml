[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "juslib"
version = "0.1.0"
description = "JUSLIB — Sovereign Multilingual Legal Library (European & International Level)"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
keywords = [
    "legal", "law", "jurisprudence", "EU", "ECHR", "multilingual",
    "legaltech", "legifrance", "eur-lex", "OHADA", "UN",
    "legal-research", "legal-library",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Groupware",
    "Natural Language :: French",
    "Natural Language :: English",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "SQLAlchemy>=2.0.29",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
search = [
    "typesense>=0.21.0",
]
graph = [
    "networkx>=3.2.1",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vgactech/JUSBIB"
Repository = "https://github.com/vgactech/JUSBIB.git"
Issues = "https://github.com/vgactech/JUSBIB/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
