name: JUSLIB CI

on:
  push:
    branches: [ main ]
    paths:
      - 'juslib/src/**'
      - 'juslib/tests/**'
      - 'juslib/pyproject.toml'
      - 'juslib/.github/**'
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: "Tests unitaires Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juslib

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      JUSLIB_DB_PATH: ":memory:"
      JUSLIB_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (unit + integration)
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Ruff lint strict
        run: |
          python -m ruff check src/ --select=E,F,W --ignore=E501

  e2e-persistence:
    name: "Test E2E persistance disque — Python 3.11"
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: juslib

    env:
      JUSLIB_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E persistence test
        run: |
          python -m pytest tests/test_juslib_j007.py -v --tb=short -k "e2e"
